<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ciaran's Rugs.fun Leaderboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'Press Start 2P', monospace;
      background: #1a1a1a;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 20px 48px;
      margin: 0;
    }

    h1 {
      font-size: 24px;
      margin: 10px 0 28px;
      color: #ffd700;
      text-shadow: 2px 2px #000;
      text-align: center;
      line-height: 1.4;
    }

    .top-actions {
      width: min(1100px, 100%);
      display: flex;
      justify-content: flex-end;
      margin-bottom: 14px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tiny-btn, .panel-button, .admin-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      border: 2px solid #555;
      background: #1c1c1c;
      color: #ffd700;
      padding: 12px 14px;
      cursor: pointer;
    }

    .tiny-btn:hover, .panel-button:hover, .admin-btn:hover {
      background: #333;
    }

    .panel {
      width: min(1100px, 100%);
      background: #2a2a2a;
      border: 4px solid #555;
      margin-bottom: 26px;
      padding: 18px;
    }

    .panel-title {
      font-size: 14px;
      color: #ffd700;
      margin-bottom: 18px;
      text-align: center;
      line-height: 1.5;
    }

    .competition-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .stat-box {
      background: #1c1c1c;
      border: 2px solid #555;
      padding: 18px 14px;
      text-align: center;
      min-height: 92px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .stat-label {
      font-size: 9px;
      color: #cfcfcf;
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .stat-value {
      font-size: 11px;
      color: #ffd700;
      line-height: 1.7;
      word-break: break-word;
    }

    .podium {
      width: min(900px, 100%);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 56px;
      margin: 8px 0 34px;
      flex-wrap: wrap;
    }

    .podium-place {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 150px;
      font-size: 12px;
      text-align: center;
    }

    .first { transform: translateY(-20px); }
    .second { transform: translateY(0); }
    .third { transform: translateY(10px); }

    .medal {
      font-size: 46px;
      margin-bottom: 10px;
      line-height: 1;
      display: inline-block;
      animation: bounce 3s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .gold-glow { text-shadow: 0 0 10px gold, 0 0 20px gold, 0 0 30px gold; }
    .silver-glow { text-shadow: 0 0 10px #c0c0c0, 0 0 20px #c0c0c0; }
    .bronze-glow { text-shadow: 0 0 10px #cd7f32, 0 0 20px #cd7f32; }

    .podium-user {
      margin-top: 8px;
      min-height: 24px;
      line-height: 1.6;
    }

    .podium-prize {
      margin-top: 10px;
      line-height: 1.6;
    }

    table {
      border-collapse: collapse;
      width: min(1100px, 100%);
      background: #2a2a2a;
      border: 4px solid #555;
      margin-bottom: 26px;
    }

    th, td {
      padding: 12px 10px;
      text-align: center;
      border: 2px solid #555;
      font-size: 10px;
      line-height: 1.5;
    }

    th {
      background: #333;
      color: #ffd700;
    }

    tr.gold {
      background: #ffd700;
      color: #000;
      font-weight: bold;
    }

    tr.silver {
      background: #c0c0c0;
      color: #000;
      font-weight: bold;
    }

    tr.bronze {
      background: #cd7f32;
      color: #000;
      font-weight: bold;
    }

    .feed-panel {
      width: min(1100px, 100%);
      background: #2a2a2a;
      border: 4px solid #555;
      padding: 18px;
    }

    .list {
      list-style: none;
      padding: 0;
      margin: 0;
      width: 100%;
    }

    .list-item {
      background: #1c1c1c;
      border: 2px solid #555;
      padding: 14px 12px;
      margin-bottom: 12px;
      font-size: 9px;
      line-height: 1.8;
      width: 100%;
      overflow-wrap: break-word;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      width: min(980px, 100%);
      max-height: 88vh;
      overflow-y: auto;
      background: #2a2a2a;
      border: 4px solid #555;
      padding: 18px;
      position: relative;
    }

    .modal-title {
      text-align: center;
      font-size: 14px;
      color: #ffd700;
      margin-bottom: 20px;
      line-height: 1.5;
      padding-right: 80px;
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      font-size: 9px;
    }

    .admin-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 14px;
    }

    .admin-box {
      background: #1c1c1c;
      border: 2px solid #555;
      padding: 14px;
    }

    .admin-box label {
      display: block;
      font-size: 9px;
      margin-bottom: 10px;
      color: #cfcfcf;
      line-height: 1.6;
    }

    .admin-box input {
      width: 100%;
      background: #111;
      color: #ffd700;
      border: 2px solid #555;
      padding: 10px;
      font-family: inherit;
      font-size: 9px;
    }

    .admin-actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 14px;
    }

    .admin-status {
      font-size: 9px;
      color: #bdbdbd;
      line-height: 1.8;
      min-height: 18px;
      margin-bottom: 12px;
    }

    @media (max-width: 900px) {
      .competition-grid, .admin-grid, .admin-actions {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 600px) {
      .competition-grid, .admin-grid, .admin-actions {
        grid-template-columns: 1fr;
      }

      th, td {
        font-size: 8px;
        padding: 10px 6px;
      }

      .medal {
        font-size: 38px;
      }
    }
  </style>
</head>
<body>
  <div class="top-actions">
    <button id="open-admin" class="tiny-btn">Admin</button>
  </div>

  <h1>Ciaran's Rugs.fun Leaderboard</h1>

  <div class="panel">
    <div class="panel-title">Weekly Competition</div>
    <div class="competition-grid">
      <div class="stat-box">
        <div class="stat-label">Reset Time</div>
        <div class="stat-value">Sunday 12:05 AM</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Countdown</div>
        <div class="stat-value" id="countdown">Loading...</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Current Pool</div>
        <div class="stat-value" id="current-pool">0.000 ◎</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Top Prize</div>
        <div class="stat-value">0.8 SOL</div>
      </div>
    </div>
  </div>

  <div class="podium">
    <div class="podium-place second">
      <div class="medal silver-glow">🥈</div>
      <div id="second-user" class="podium-user">---</div>
      <div class="podium-prize">0.4 SOL</div>
    </div>

    <div class="podium-place first">
      <div class="medal gold-glow">🥇</div>
      <div id="first-user" class="podium-user">---</div>
      <div class="podium-prize">0.8 SOL</div>
    </div>

    <div class="podium-place third">
      <div class="medal bronze-glow">🥉</div>
      <div id="third-user" class="podium-user">---</div>
      <div class="podium-prize">0.3 SOL</div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Rank</th>
        <th>User</th>
        <th>Total Wagered</th>
        <th>Prize</th>
      </tr>
    </thead>
    <tbody id="leaderboard"></tbody>
  </table>

  <div class="feed-panel">
    <div class="panel-title">Live Wager Feed</div>
    <ul id="live-feed" class="list"></ul>
  </div>

  <div id="admin-modal" class="modal">
    <div class="modal-content">
      <button id="close-admin" class="tiny-btn modal-close">Close</button>
      <div class="modal-title">Admin Leaderboard Editor</div>

      <div class="admin-grid">
        <div class="admin-box">
          <label>Admin Key</label>
          <input id="admin-key" type="password" placeholder="Enter admin key">
        </div>
        <div class="admin-box">
          <label>Wallet</label>
          <input id="admin-wallet" type="text" placeholder="Wallet address">
        </div>
        <div class="admin-box">
          <label>Name</label>
          <input id="admin-name" type="text" placeholder="Display name">
        </div>
        <div class="admin-box">
          <label>Amount (SOL)</label>
          <input id="admin-amount" type="number" step="0.001" placeholder="0.000">
        </div>
      </div>

      <div class="admin-actions">
        <button class="admin-btn" id="add-player-btn">Add Amount</button>
        <button class="admin-btn" id="set-player-btn">Set Exact Amount</button>
        <button class="admin-btn" id="delete-player-btn">Delete Player</button>
        <button class="admin-btn" id="reset-week-btn">Reset Week</button>
      </div>

      <div id="admin-status" class="admin-status"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    function getNextReset() {
      const now = new Date();
      const next = new Date(now);
      const day = now.getDay();
      let daysUntilSunday = (7 - day) % 7;

      next.setDate(now.getDate() + daysUntilSunday);
      next.setHours(0, 5, 0, 0);

      if (next <= now) {
        next.setDate(next.getDate() + 7);
      }

      return next;
    }

    function updateCountdown() {
      const now = new Date();
      const nextReset = getNextReset();
      const diff = nextReset - now;

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById("countdown").textContent =
        `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }

    function shortenWallet(wallet) {
      if (!wallet) return "Unknown";
      if (wallet.length < 12) return wallet;
      return `${wallet.slice(0, 6)}...${wallet.slice(-6)}`;
    }

    function displayName(entry) {
      return entry?.username || shortenWallet(entry?.user);
    }

    async function loadLeaderboard() {
      const res = await fetch("/api/wagers");
      const data = await res.json();

      const totals = [...data].sort((a, b) => Number(b.amount || 0) - Number(a.amount || 0));
      const currentPool = totals.reduce((sum, entry) => sum + Number(entry.amount || 0), 0);

      document.getElementById("current-pool").textContent = `${currentPool.toFixed(3)} ◎`;
      document.getElementById("first-user").textContent = displayName(totals[0]);
      document.getElementById("second-user").textContent = displayName(totals[1]);
      document.getElementById("third-user").textContent = displayName(totals[2]);

      const tbody = document.getElementById("leaderboard");
      tbody.innerHTML = "";

      totals.forEach((entry, i) => {
        let prize = "";
        let rowClass = "";

        if (i === 0) { prize = "0.8 SOL"; rowClass = "gold"; }
        else if (i === 1) { prize = "0.4 SOL"; rowClass = "silver"; }
        else if (i === 2) { prize = "0.3 SOL"; rowClass = "bronze"; }

        tbody.innerHTML += `
          <tr class="${rowClass}">
            <td>${i + 1}</td>
            <td>${displayName(entry)}</td>
            <td>${Number(entry.amount || 0).toFixed(3)} ◎</td>
            <td>${prize}</td>
          </tr>
        `;
      });

      renderFeed(totals);
    }

    function renderFeed(entries) {
      const feed = document.getElementById("live-feed");
      feed.innerHTML = "";

      const latest = [...entries].slice(0, 8);

      if (!latest.length) {
        feed.innerHTML = `<li class="list-item">No wagers yet.</li>`;
        return;
      }

      latest.forEach((entry) => {
        feed.innerHTML += `
          <li class="list-item">
            <div><strong>${displayName(entry)}</strong></div>
            <div>${Number(entry.amount || 0).toFixed(3)} ◎ total wagered</div>
          </li>
        `;
      });
    }

    function adminValues() {
      return {
        key: document.getElementById("admin-key").value.trim(),
        wallet: document.getElementById("admin-wallet").value.trim(),
        username: document.getElementById("admin-name").value.trim(),
        amount: document.getElementById("admin-amount").value.trim()
      };
    }

    function setAdminStatus(text) {
      document.getElementById("admin-status").textContent = text;
    }

    async function adminPost(url, body) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        throw new Error(data.error || "Request failed");
      }

      return data;
    }

    async function addPlayer() {
      try {
        const { key, wallet, username, amount } = adminValues();
        await adminPost("/admin/add-player", {
          key,
          wallet,
          username,
          amount: Number(amount)
        });
        setAdminStatus("Player amount added.");
        await loadLeaderboard();
      } catch (err) {
        setAdminStatus(err.message);
      }
    }

    async function setPlayer() {
      try {
        const { key, wallet, username, amount } = adminValues();
        await adminPost("/admin/set-player", {
          key,
          wallet,
          username,
          amount: Number(amount)
        });
        setAdminStatus("Player updated.");
        await loadLeaderboard();
      } catch (err) {
        setAdminStatus(err.message);
      }
    }

    async function deletePlayer() {
      try {
        const { key, wallet } = adminValues();
        await adminPost("/admin/delete-player", { key, wallet });
        setAdminStatus("Player deleted.");
        await loadLeaderboard();
      } catch (err) {
        setAdminStatus(err.message);
      }
    }

    async function resetWeek() {
      try {
        const { key } = adminValues();
        await adminPost("/admin/reset-week", { key });
        setAdminStatus("Week reset and winners saved.");
        await loadLeaderboard();
      } catch (err) {
        setAdminStatus(err.message);
      }
    }

    const adminModal = document.getElementById("admin-modal");
    document.getElementById("open-admin").addEventListener("click", () => {
      adminModal.classList.add("show");
    });
    document.getElementById("close-admin").addEventListener("click", () => {
      adminModal.classList.remove("show");
    });
    adminModal.addEventListener("click", (e) => {
      if (e.target === adminModal) adminModal.classList.remove("show");
    });

    document.getElementById("add-player-btn").addEventListener("click", addPlayer);
    document.getElementById("set-player-btn").addEventListener("click", setPlayer);
    document.getElementById("delete-player-btn").addEventListener("click", deletePlayer);
    document.getElementById("reset-week-btn").addEventListener("click", resetWeek);

    updateCountdown();
    loadLeaderboard();

    const socket = io();
    socket.on("update", () => loadLeaderboard());

    setInterval(loadLeaderboard, 15000);
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
