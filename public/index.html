<!DOCTYPE html>
<html>
<head>
<title>Ciaran's Rugs.fun Leaderboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

body {
  font-family: 'Press Start 2P', monospace;
  background: #1A1A1A;
  color: #F0F0F0;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 30px;
}

h1 {
  font-size: 28px;
  margin-bottom: 40px;
  color: #FFCC00;
  text-shadow: 2px 2px #333;
}

/* Podium container */
.podium {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 50px;
  align-items: flex-end;
  perspective: 600px;
}

/* Podium block */
.podium-place {
  width: 130px;
  text-align: center;
  position: relative;
  font-weight: bold;
  transform-style: preserve-3d;
  transition: transform 0.3s;
  border-radius: 8px;
  color: #000;
  box-shadow: 0 4px 8px rgba(0,0,0,0.7);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}

/* Hover tilt */
.podium-place:hover {
  transform: rotateX(8deg) rotateY(5deg) scale(1.05);
}

/* Bounce animations */
@keyframes bounceFirst {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}
@keyframes bounceSecond {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
@keyframes bounceThird {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}

/* Podium blocks with shading for depth */
.first { 
  height: 180px; 
  background: linear-gradient(to top, #FFD700, #FFE766);
  z-index:3; 
  animation: bounceFirst 1.5s infinite ease-in-out;
}
.second { 
  height: 140px; 
  background: linear-gradient(to top, #C0C0C0, #E0E0E0);
  z-index:2; 
  animation: bounceSecond 1.8s infinite ease-in-out;
}
.third { 
  height: 120px; 
  background: linear-gradient(to top, #CD7F32, #E09C6F);
  z-index:1; 
  animation: bounceThird 2s infinite ease-in-out;
}

.podium-place .medal {
  font-size: 40px;
  margin-bottom: 8px;
}

.podium-place div {
  margin-bottom: 10px;
  font-size: 16px;
  color: #111; /* solid color to be readable on background */
}

/* Table styling */
table {
  border-collapse: collapse;
  width: 700px;
  background: #2A2A2A;
  border: 4px solid #555;
  box-shadow: 4px 4px 0 #111;
}

th, td {
  padding: 10px;
  text-align: center;
  border: 2px solid #555;
  font-size: 12px;
  background: #1C1C1C;
  color: #F0F0F0;
}

th {
  background: #333;
  color: #FFD700;
}

tr.gold { background: #FFD700; color: #000; font-weight: bold; }
tr.silver { background: #C0C0C0; color: #000; font-weight: bold; }
tr.bronze { background: #CD7F32; color: #000; font-weight: bold; }
tr:hover { background: #444; }

</style>
</head>
<body>

<h1>Ciaran's Rugs.fun Leaderboard</h1>

<div class="podium" id="podium">
  <div class="podium-place second">
    <span class="medal">🥈</span>
    <div id="second-user">---</div>
    <div id="second-prize">0.4 SOL</div>
  </div>
  <div class="podium-place first">
    <span class="medal">🏆</span>
    <div id="first-user">---</div>
    <div id="first-prize">0.8 SOL</div>
  </div>
  <div class="podium-place third">
    <span class="medal">🥉</span>
    <div id="third-user">---</div>
    <div id="third-prize">0.3 SOL</div>
  </div>
</div>

<table>
  <thead>
    <tr>
      <th>Rank</th>
      <th>User</th>
      <th>Total Wagered (SOL)</th>
      <th>Prize</th>
    </tr>
  </thead>
  <tbody id="leaderboard"></tbody>
</table>

<script src="/socket.io/socket.io.js"></script>
<script>
async function loadData() {
  const res = await fetch("/api/wagers");
  const wagers = await res.json();

  const totals = {};
  wagers.forEach(w => {
    if (!totals[w.user]) totals[w.user] = { amount: 0, username: w.username };
    totals[w.user].amount += w.amount;
  });

  const sorted = Object.values(totals).sort((a,b) => b.amount - a.amount);

  // Update podium
  if(sorted[0]){
    document.getElementById("first-user").textContent = sorted[0].username || "Unknown";
    document.getElementById("first-prize").textContent = "0.8 SOL";
  }
  if(sorted[1]){
    document.getElementById("second-user").textContent = sorted[1].username || "Unknown";
    document.getElementById("second-prize").textContent = "0.4 SOL";
  }
  if(sorted[2]){
    document.getElementById("third-user").textContent = sorted[2].username || "Unknown";
    document.getElementById("third-prize").textContent = "0.3 SOL";
  }

  const tbody = document.getElementById("leaderboard");
  tbody.innerHTML = "";
  sorted.forEach((entry,i)=>{
    let prize="", rowClass="";
    if(i===0){ prize="0.8 SOL"; rowClass="gold"; }
    if(i===1){ prize="0.4 SOL"; rowClass="silver"; }
    if(i===2){ prize="0.3 SOL"; rowClass="bronze"; }

    const displayName = entry.username || "Unknown";
    tbody.innerHTML += `<tr class="${rowClass}">
      <td>${i+1}</td>
      <td>${displayName}</td>
      <td>${entry.amount.toFixed(3)} ◎</td>
      <td>${prize}</td>
    </tr>`;
  });
}

loadData();
const socket = io();
socket.on("update", ()=>loadData());
setInterval(loadData,15000);
</script>

</body>
</html>
