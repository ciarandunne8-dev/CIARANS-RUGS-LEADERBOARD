```html
<!DOCTYPE html>
<html>
<head>
<title>Ciaran's Rugs.fun Leaderboard</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>

body{
font-family:'Press Start 2P',monospace;
background:#1A1A1A;
color:#F0F0F0;
display:flex;
flex-direction:column;
align-items:center;
padding:30px;
}

h1{
font-size:26px;
margin-bottom:40px;
color:#FFD700;
text-shadow:2px 2px #000;
}

/* PODIUM */

.podium{
display:flex;
justify-content:center;
align-items:flex-end;
gap:40px;
margin-bottom:50px;
}

.podium-place{
display:flex;
flex-direction:column;
align-items:center;
width:130px;
}

.first{transform:translateY(-20px);}
.second{transform:translateY(0);}
.third{transform:translateY(10px);}

.place-label{
margin-top:8px;
font-size:12px;
}

.prize{
font-size:10px;
opacity:0.8;
}

/* MEDALS */

.medal{
width:70px;
height:70px;
border-radius:50%;
animation:spin 6s linear infinite, glow 2s ease-in-out infinite alternate;
}

.gold{
background:linear-gradient(145deg,#ffd700,#ffb300);
box-shadow:0 0 20px rgba(255,215,0,0.9);
}

.silver{
background:linear-gradient(145deg,#e0e0e0,#9e9e9e);
box-shadow:0 0 18px rgba(220,220,220,0.9);
}

.bronze{
background:linear-gradient(145deg,#cd7f32,#8c4b1f);
box-shadow:0 0 15px rgba(205,127,50,0.9);
}

/* crown */

.crown{
font-size:28px;
animation:crownFloat 2s ease-in-out infinite;
}

@keyframes crownFloat{
0%{transform:translateY(0)}
50%{transform:translateY(-6px)}
100%{transform:translateY(0)}
}

/* animations */

@keyframes spin{
0%{transform:rotateY(0deg);}
100%{transform:rotateY(360deg);}
}

@keyframes glow{
from{filter:brightness(1)}
to{filter:brightness(1.3)}
}

/* TABLE */

table{
border-collapse:collapse;
width:700px;
background:#2A2A2A;
border:4px solid #555;
}

th,td{
padding:10px;
text-align:center;
border:2px solid #555;
font-size:10px;
}

th{
background:#333;
color:#FFD700;
}

tr.gold{
background:#FFD700;
color:#000;
font-weight:bold;
}

tr.silver{
background:#C0C0C0;
color:#000;
font-weight:bold;
}

tr.bronze{
background:#CD7F32;
color:#000;
font-weight:bold;
}

tr:hover{
background:#444;
}

</style>

</head>

<body>

<h1>Ciaran's Rugs.fun Leaderboard</h1>

<div class="podium">

<div class="podium-place second">
<div class="medal silver"></div>
<div id="second-user">---</div>
<div class="place-label">2nd</div>
<div class="prize">0.4 SOL</div>
</div>

<div class="podium-place first">
<div class="crown">👑</div>
<div class="medal gold"></div>
<div id="first-user">---</div>
<div class="place-label">1st</div>
<div class="prize">0.8 SOL</div>
</div>

<div class="podium-place third">
<div class="medal bronze"></div>
<div id="third-user">---</div>
<div class="place-label">3rd</div>
<div class="prize">0.3 SOL</div>
</div>

</div>

<table>

<thead>
<tr>
<th>Rank</th>
<th>User</th>
<th>Total Wagered</th>
<th>Prize</th>
</tr>
</thead>

<tbody id="leaderboard"></tbody>

</table>

<script src="/socket.io/socket.io.js"></script>

<script>

async function loadData(){

const res = await fetch("/api/wagers")
const wagers = await res.json()

const totals={}

wagers.forEach(w=>{

if(!totals[w.user]){
totals[w.user]={amount:0,username:w.username}
}

totals[w.user].amount+=w.amount

})

const sorted = Object.values(totals).sort((a,b)=>b.amount-a.amount)

if(sorted[0]){
document.getElementById("first-user").textContent=sorted[0].username||"Unknown"
}

if(sorted[1]){
document.getElementById("second-user").textContent=sorted[1].username||"Unknown"
}

if(sorted[2]){
document.getElementById("third-user").textContent=sorted[2].username||"Unknown"
}

const tbody=document.getElementById("leaderboard")
tbody.innerHTML=""

sorted.forEach((entry,i)=>{

let prize=""
let rowClass=""

if(i===0){prize="0.8 SOL";rowClass="gold"}
if(i===1){prize="0.4 SOL";rowClass="silver"}
if(i===2){prize="0.3 SOL";rowClass="bronze"}

const displayName=entry.username||"Unknown"

tbody.innerHTML+=`
<tr class="${rowClass}">
<td>${i+1}</td>
<td>${displayName}</td>
<td>${entry.amount.toFixed(3)} ◎</td>
<td>${prize}</td>
</tr>
`

})

}

loadData()

const socket=io()

socket.on("update",()=>loadData())

setInterval(loadData,15000)

</script>

</body>
</html>
```
