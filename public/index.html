<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ciaran's Rugs.fun Leaderboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Press Start 2P', monospace;
      background: #1a1a1a;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      margin: 0;
    }

    h1 {
      font-size: 24px;
      margin: 16px 0 28px;
      color: #ffd700;
      text-shadow: 2px 2px #000;
      text-align: center;
    }

    .panel {
      width: min(900px, 95vw);
      background: #2a2a2a;
      border: 4px solid #555;
      margin-bottom: 24px;
      padding: 18px;
      box-sizing: border-box;
    }

    .panel-title {
      font-size: 14px;
      color: #ffd700;
      margin-bottom: 16px;
      text-align: center;
    }

    .competition-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      text-align: center;
    }

    .stat-box {
      background: #1c1c1c;
      border: 2px solid #555;
      padding: 14px 10px;
    }

    .stat-label {
      font-size: 9px;
      color: #cfcfcf;
      margin-bottom: 10px;
    }

    .stat-value {
      font-size: 11px;
      color: #ffd700;
      line-height: 1.5;
    }

    .podium {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 40px;
      margin-bottom: 36px;
      flex-wrap: wrap;
    }

    .podium-place {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 140px;
      font-size: 12px;
      text-align: center;
    }

    .first {
      transform: translateY(-20px);
    }

    .second {
      transform: translateY(0);
    }

    .third {
      transform: translateY(10px);
    }

    .medal {
      font-size: 42px;
      margin-bottom: 8px;
      line-height: 1;
      animation: bounce 3s ease-in-out infinite;
      display: inline-block;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    .gold-glow {
      text-shadow:
        0 0 10px gold,
        0 0 20px gold,
        0 0 30px gold;
    }

    .silver-glow {
      text-shadow:
        0 0 10px #c0c0c0,
        0 0 20px #c0c0c0;
    }

    .bronze-glow {
      text-shadow:
        0 0 10px #cd7f32,
        0 0 20px #cd7f32;
    }

    .podium-user {
      margin-top: 8px;
      min-height: 20px;
    }

    .podium-prize {
      margin-top: 8px;
    }

    table {
      border-collapse: collapse;
      width: min(900px, 95vw);
      background: #2a2a2a;
      border: 4px solid #555;
      margin-bottom: 24px;
    }

    th, td {
      padding: 10px;
      text-align: center;
      border: 2px solid #555;
      font-size: 10px;
    }

    th {
      background: #333;
      color: #ffd700;
    }

    tr.gold {
      background: #ffd700;
      color: #000;
      font-weight: bold;
    }

    tr.silver {
      background: #c0c0c0;
      color: #000;
      font-weight: bold;
    }

    tr.bronze {
      background: #cd7f32;
      color: #000;
      font-weight: bold;
    }

    tr:hover {
      background: #444;
    }

    .two-column {
      width: min(900px, 95vw);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .feed-list,
    .history-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .feed-item,
    .history-item {
      background: #1c1c1c;
      border: 2px solid #555;
      padding: 12px;
      margin-bottom: 10px;
      font-size: 9px;
      line-height: 1.6;
    }

    .winner-line {
      margin-top: 8px;
    }

    .muted {
      color: #bdbdbd;
    }

    @media (max-width: 800px) {
      .competition-grid,
      .two-column {
        grid-template-columns: 1fr;
      }

      .podium {
        gap: 20px;
      }

      .podium-place {
        width: 110px;
      }

      h1 {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <h1>Ciaran's Rugs.fun Leaderboard</h1>

  <div class="panel">
    <div class="panel-title">Weekly Competition</div>
    <div class="competition-grid">
      <div class="stat-box">
        <div class="stat-label">Reset Time</div>
        <div class="stat-value">Saturday 12:05 AM</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Countdown</div>
        <div class="stat-value" id="countdown">Loading...</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Current Pool</div>
        <div class="stat-value" id="current-pool">0.000 ◎</div>
      </div>
    </div>
  </div>

  <div class="podium">
    <div class="podium-place second">
      <div class="medal silver-glow">🥈</div>
      <div id="second-user" class="podium-user">---</div>
      <div class="podium-prize">0.4 SOL</div>
    </div>

    <div class="podium-place first">
      <div class="medal gold-glow">🥇</div>
      <div id="first-user" class="podium-user">---</div>
      <div class="podium-prize">0.8 SOL</div>
    </div>

    <div class="podium-place third">
      <div class="medal bronze-glow">🥉</div>
      <div id="third-user" class="podium-user">---</div>
      <div class="podium-prize">0.3 SOL</div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Rank</th>
        <th>User</th>
        <th>Total Wagered</th>
        <th>Prize</th>
      </tr>
    </thead>
    <tbody id="leaderboard"></tbody>
  </table>

  <div class="two-column">
    <div class="panel">
      <div class="panel-title">Live Wager Feed</div>
      <ul id="live-feed" class="feed-list"></ul>
    </div>

    <div class="panel">
      <div class="panel-title">Past Winners</div>
      <ul id="past-winners" class="history-list"></ul>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    function getNextReset() {
      const now = new Date();
      const next = new Date(now);

      // Saturday = 6
      const day = now.getDay();
      let daysUntilSaturday = (6 - day + 7) % 7;

      next.setDate(now.getDate() + daysUntilSaturday);
      next.setHours(0, 5, 0, 0);

      // If it's already past Saturday 12:05 AM this week, move to next week
      if (next <= now) {
        next.setDate(next.getDate() + 7);
      }

      return next;
    }

    function updateCountdown() {
      const now = new Date();
      const nextReset = getNextReset();
      const diff = nextReset - now;

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById("countdown").textContent =
        `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }

    function safeName(entry) {
      return entry?.username || entry?.user || "Unknown";
    }

    async function loadLeaderboard() {
      const res = await fetch("/api/wagers");
      const wagers = await res.json();

      const totals = {};
      let currentPool = 0;

      wagers.forEach((w) => {
        currentPool += Number(w.amount || 0);

        if (!totals[w.user]) {
          totals[w.user] = {
            user: w.user,
            username: w.username,
            amount: 0
          };
        }

        totals[w.user].amount += Number(w.amount || 0);
      });

      const sorted = Object.values(totals).sort((a, b) => b.amount - a.amount);

      document.getElementById("current-pool").textContent = `${currentPool.toFixed(3)} ◎`;

      document.getElementById("first-user").textContent = safeName(sorted[0]);
      document.getElementById("second-user").textContent = safeName(sorted[1]);
      document.getElementById("third-user").textContent = safeName(sorted[2]);

      const tbody = document.getElementById("leaderboard");
      tbody.innerHTML = "";

      sorted.forEach((entry, i) => {
        let prize = "";
        let rowClass = "";

        if (i === 0) {
          prize = "0.8 SOL";
          rowClass = "gold";
        } else if (i === 1) {
          prize = "0.4 SOL";
          rowClass = "silver";
        } else if (i === 2) {
          prize = "0.3 SOL";
          rowClass = "bronze";
        }

        tbody.innerHTML += `
          <tr class="${rowClass}">
            <td>${i + 1}</td>
            <td>${safeName(entry)}</td>
            <td>${entry.amount.toFixed(3)} ◎</td>
            <td>${prize}</td>
          </tr>
        `;
      });

      renderLiveFeed(wagers);
    }

    function renderLiveFeed(wagers) {
      const feed = document.getElementById("live-feed");
      feed.innerHTML = "";

      const latest = [...wagers].slice(-8).reverse();

      if (latest.length === 0) {
        feed.innerHTML = `<li class="feed-item muted">No wagers yet.</li>`;
        return;
      }

      latest.forEach((w) => {
        feed.innerHTML += `
          <li class="feed-item">
            <div><strong>${safeName(w)}</strong></div>
            <div>${Number(w.amount || 0).toFixed(3)} ◎ wagered</div>
          </li>
        `;
      });
    }

    async function loadHistory() {
      try {
        const res = await fetch("/api/history");
        const history = await res.json();

        const historyList = document.getElementById("past-winners");
        historyList.innerHTML = "";

        if (!history.length) {
          historyList.innerHTML = `<li class="history-item muted">No previous winners yet.</li>`;
          return;
        }

        [...history].reverse().forEach((week) => {
          const winners = week.winners || [];
          const dateText = week.date ? new Date(week.date).toLocaleDateString() : "Previous Week";

          historyList.innerHTML += `
            <li class="history-item">
              <div><strong>${dateText}</strong></div>
              <div class="winner-line">🥇 ${safeName(winners[0])} ${winners[0] ? `— ${Number(winners[0].amount || 0).toFixed(3)} ◎` : ""}</div>
              <div class="winner-line">🥈 ${safeName(winners[1])} ${winners[1] ? `— ${Number(winners[1].amount || 0).toFixed(3)} ◎` : ""}</div>
              <div class="winner-line">🥉 ${safeName(winners[2])} ${winners[2] ? `— ${Number(winners[2].amount || 0).toFixed(3)} ◎` : ""}</div>
            </li>
          `;
        });
      } catch (err) {
        document.getElementById("past-winners").innerHTML =
          `<li class="history-item muted">Could not load winner history.</li>`;
      }
    }

    async function refreshAll() {
      await loadLeaderboard();
      await loadHistory();
    }

    refreshAll();
    updateCountdown();

    const socket = io();
    socket.on("update", () => refreshAll());

    setInterval(refreshAll, 15000);
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
